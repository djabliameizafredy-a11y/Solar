<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Système solaire 3D interactif</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Fredoka:wght@500;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#02030a;--fg:#e8ecf8;--mut:#93a0c2;--pan:rgba(12,17,36,.9);--bd:rgba(150,170,255,.2);--ac:#ffb84d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 Nunito,"Segoe UI",system-ui,sans-serif;overflow:hidden}
#app{position:relative;width:100%;height:100%;overflow:hidden}
canvas{position:absolute;inset:0;cursor:grab}canvas:active{cursor:grabbing}
.ui{position:absolute;pointer-events:none}.ui>*{pointer-events:auto}
#labels{inset:0;overflow:hidden}
.lb{position:absolute;left:0;top:0;margin:-9px 0 0 9px;font-size:12px;color:rgba(232,236,248,.92);text-shadow:0 0 4px #000,0 0 4px #000;cursor:pointer;white-space:nowrap;padding:2px 4px}
#top{top:8px;left:8px;right:8px}
h1{font:500 19px/1.2 Fredoka,"Trebuchet MS",system-ui,sans-serif;margin:0}
#sub{color:var(--mut);font-size:12px;margin:2px 0 6px}
#chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;background:var(--pan);color:var(--fg);border:1px solid var(--bd);border-radius:20px;padding:4px 11px 4px 8px;font:inherit;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip i{width:10px;height:10px;border-radius:50%;display:block}
.chip.on{border-color:var(--ac);color:var(--ac)}
#info{top:112px;right:8px;width:330px;max-height:calc(100% - 205px);overflow:auto;background:var(--pan);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;backdrop-filter:blur(8px);display:none}
#info h2{margin:0;font-size:22px}
#info .ty{color:var(--ac);font-size:12.5px;margin-bottom:8px}
#info dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:8px 0;font-size:13px}
#info dt{color:var(--mut)}#info dd{margin:0}
#info p{margin:8px 0 0;font-size:13.5px}
#info .f{background:rgba(255,184,77,.1);border-left:3px solid var(--ac);padding:6px 10px;border-radius:0 8px 8px 0}
#seew{left:0;right:0;bottom:76px;display:none;text-align:center;pointer-events:none}
#see{pointer-events:auto;font:700 17px Fredoka,"Trebuchet MS",system-ui,sans-serif;color:#1a1200;background:#ffcf4a;border:0;border-radius:14px;padding:11px 24px;box-shadow:0 4px 0 #b8861a,0 6px 18px rgba(0,0,0,.5)}
#see:active{transform:translateY(3px);box-shadow:0 1px 0 #b8861a}
#lg{top:8px;right:8px;z-index:30;display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:var(--pan)}
#lg button{background:none;border:0;color:var(--mut);font:700 12px Nunito,system-ui,sans-serif;padding:6px 10px}
#lg button.on{background:#ffcf4a;color:#1a1200}
#xb{position:absolute;top:8px;right:10px;background:none;border:0;color:var(--mut);font-size:24px;cursor:pointer;line-height:1}
#tip{bottom:70px;left:8px;right:8px;text-align:center;color:var(--mut);font-size:13px;pointer-events:none}
#bar{bottom:8px;left:8px;right:8px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
#bar>*{background:var(--pan);border:1px solid var(--bd);border-radius:10px;color:var(--fg);font:inherit;padding:6px 11px}
button{cursor:pointer}#bar button{min-width:38px;font-size:16px}
#bar label{display:flex;align-items:center;gap:6px;font-size:13px}
#bar input[type=range]{width:130px;accent-color:var(--ac)}
#sp{min-width:76px;font-size:12px;color:var(--mut)}
#home{position:absolute;inset:0;z-index:10;display:flex;align-items:center;padding:clamp(20px,6vw,84px);background:linear-gradient(90deg,rgba(2,3,10,.95) 0%,rgba(2,3,10,.84) 40%,rgba(2,3,10,.04) 78%);overflow:auto;transition:opacity .5s}
#home.off{opacity:0;pointer-events:none}
.hi{max-width:540px;margin:auto 0}
.kick{display:flex;align-items:center;gap:10px;color:#ffcf4a;font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px}
.kick:before{content:"";width:28px;height:2px;background:#ffcf4a}
.hi h2{font:700 clamp(36px,5.6vw,64px)/1.04 Fredoka,"Trebuchet MS",system-ui,sans-serif;margin:0 0 18px;color:#fff}
.hl{position:relative;white-space:nowrap;color:#ffcf4a}
.hl svg{position:absolute;left:0;bottom:-.14em;width:100%;height:.28em}
.hi p{margin:0;font-size:17px;line-height:1.6;color:#c3cbe3;max-width:46ch}
.facts{display:flex;gap:26px;margin:26px 0 22px}
.facts div{border-left:2px solid rgba(255,255,255,.2);padding-left:12px}
.facts b{display:block;font:700 40px/1 Fredoka,"Trebuchet MS",system-ui,sans-serif;color:#fff}
.facts span{font-size:13px;color:var(--mut)}
.note{display:inline-block;background:#ffe58a;color:#3b2f00;font:600 21px/1.2 Caveat,"Segoe Print","Bradley Hand",cursive;padding:10px 16px;transform:rotate(-1.8deg);box-shadow:3px 4px 0 rgba(0,0,0,.4);max-width:330px;margin-bottom:26px}
.how{list-style:none;margin:0 0 26px;padding:0;display:grid;gap:8px;counter-reset:n;font-size:15px;color:#dfe5f7}
.how li{counter-increment:n;display:flex;align-items:center;gap:10px}
.how li:before{content:counter(n);flex:none;width:24px;height:24px;border-radius:50%;border:2px solid #ffcf4a;color:#ffcf4a;font-weight:700;font-size:13px;display:grid;place-items:center}
#go{font:700 19px Fredoka,"Trebuchet MS",system-ui,sans-serif;color:#1a1200;background:#ffcf4a;border:0;border-radius:14px;padding:14px 26px;cursor:pointer;box-shadow:0 5px 0 #b8861a;transition:transform .1s,box-shadow .1s}
#go:hover{transform:translateY(-2px);box-shadow:0 7px 0 #b8861a}
#go:active{transform:translateY(4px);box-shadow:0 1px 0 #b8861a}
.back{display:block;margin-top:12px;font-size:12.5px;color:var(--mut)}
@media(max-width:760px){#home{background:linear-gradient(180deg,rgba(2,3,10,.96),rgba(2,3,10,.88) 65%,rgba(2,3,10,.55));align-items:flex-start}.facts{gap:16px}.facts b{font-size:32px}}
@media(max-height:660px){.note,.how{display:none}.facts{margin:18px 0}}
@media(max-width:700px),(max-height:560px){.hint{display:none}#bar{gap:6px}#bar>*{padding:5px 8px}#bar input[type=range]{width:90px}}
@media(max-height:560px){#tip{display:none}}
@media(max-width:700px){#info{top:auto;bottom:112px;left:8px;right:8px;width:auto;max-height:38%}#tip{bottom:auto;top:92px}}

const S=[
{id:'sun',n:'Soleil',ty:'Étoile · naine jaune (type G2V)',c1:'#fff3b0',c2:'#ff9d00',r:30,a:0,p:0,d:'1 392 700 km (109 × la Terre)',di:'—',y:'≈ 230 millions d’années pour un tour de la Voie lactée',j:'≈ 25 jours à l’équateur',T:'5 500 °C en surface · 15 millions °C au cœur',m:'—',f:'Le Soleil renferme 99,86 % de toute la masse du système solaire. Sa lumière met 8 min 20 s pour atteindre la Terre.',e:'Au cœur du Soleil, la fusion nucléaire transforme environ 600 millions de tonnes d’hydrogène en hélium chaque seconde. Cette énergie éclaire et chauffe tous les astres qui l’entourent.'},
